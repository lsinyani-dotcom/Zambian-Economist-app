<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>The Zambian Economist</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- Masthead -->
    <header class="masthead" id="masthead">
      <div class="masthead-row">
        <button class="icon-btn" id="btn-refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <div class="wordmark" id="wordmark">
          <span class="wm-the">The</span>
          <span class="wm-name">Zambian Economist</span>
        </div>
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
      <div class="dateline" id="dateline"></div>
      <nav class="chips" id="chips" aria-label="Sections"></nav>
    </header>

    <!-- Views -->
    <main id="main">
      <div class="ptr" id="ptr"><span class="ptr-spinner"></span></div>
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-sections"></section>
      <section class="view" id="view-editions"></section>
      <section class="view" id="view-saved"></section>
      <section class="view" id="view-search">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-input" type="search" placeholder="Search The Zambian Economist" autocomplete="off" enterkeyhint="search">
        </div>
        <div id="search-results"></div>
      </section>
    </main>

    <button class="new-pill" id="new-pill" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      New stories
    </button>
    <div class="offline-bar" id="offline-bar" hidden>You are offline. Showing saved copies.</div>

    <!-- Bottom tab bar -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="sections">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Sections</span>
      </button>
      <button class="tab" data-tab="editions">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>
        <span>Editions</span>
      </button>
      <button class="tab" data-tab="saved">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
        <span>Saved</span>
      </button>
      <button class="tab" data-tab="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search</span>
      </button>
    </nav>

    <!-- Article reader (slides over everything) -->
    <article class="reader" id="reader" aria-hidden="true">
      <div class="reader-bar">
        <button class="icon-btn" id="reader-back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="reader-actions">
          <button class="icon-btn" id="reader-text" aria-label="Text size">
            <svg viewBox="0 0 24 24" class="aa"><text x="1" y="18" font-size="12" font-family="serif" stroke="none" fill="currentColor">A</text><text x="10" y="19" font-size="17" font-family="serif" stroke="none" fill="currentColor">A</text></svg>
          </button>
          <button class="icon-btn" id="reader-save" aria-label="Save article">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </button>
          <button class="icon-btn" id="reader-share" aria-label="Share">
            <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
          </button>
        </div>
      </div>
      <div class="reader-scroll" id="reader-scroll">
        <div class="reader-inner" id="reader-inner"></div>
      </div>
    </article>

    <!-- Settings sheet -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-handle"></div>
      <h2>Settings</h2>
      <div class="setting">
        <span>Article text size</span>
        <div class="seg" id="seg-size">
          <button data-size="0">Small</button><button data-size="1">Medium</button><button data-size="2">Large</button><button data-size="3">X-Large</button>
        </div>
      </div>
      <div class="setting">
        <span>Appearance</span>
        <div class="seg" id="seg-theme">
          <button data-theme="auto">Device</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
        </div>
      </div>
      <div class="sheet-links">
        <a data-ext="https://zambianeconomist.com/subscribe/">Subscribe to The Ledger newsletter</a>
        <a data-ext="https://zambianeconomist.com/advertise/">Advertise with us</a>
        <a data-ext="https://zambianeconomist.com/submit-article/">Submit an article</a>
        <a data-ext="https://zambianeconomist.com/directory/">Business Directory</a>
        <a data-ext="https://zambianeconomist.com/public-money-tracker/">Public Money Tracker</a>
        <a data-ext="https://zambianeconomist.com/contact/">Contact the newsroom</a>
        <a data-ext="https://zambianeconomist.com/privacy-policy/">Privacy policy</a>
      </div>
      <p class="sheet-foot" id="app-version">The Zambian Economist</p>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="vendor/capacitor.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
